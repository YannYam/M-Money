steps:
  # 1. Build the Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/lazyspend-app', './app_build']
    id: 'Build Image'

  # 2. Push the container image to Google Container Registry (GCR)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lazyspend-app']
    id: 'Push Image'

  # 3. Deploy the container to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lazyspend-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/lazyspend-app'
      - '--region'
      - 'asia-southeast2'  # Jakarta region (change if needed)
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '80'
    id: 'Deploy to Cloud Run'

images:
  - 'gcr.io/$PROJECT_ID/lazyspend-app'

options:
  logging: CLOUD_LOGGING_ONLY
